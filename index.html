<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Calculator</title>
  
  <script>
    function calculateProbability(min, max, rolls, target) {
      let dp = new Map([[0, 1n]]);
        
      for (let r = 0; r < rolls; r++) {
          const next = new Map();
          for (const [sum, count] of dp) {
              for (let n = min; n <= max; n++) {
                  const newSum = sum + n;
                  next.set( newSum, (next.get(newSum) || 0n) + count);
              }
          }
          dp = next;
      }
  
      let favorable = 0n;
  
      for (const [sum, count] of dp) {
          if (sum >= target) {
              favorable += count;
          }
      }
  
      const total = BigInt(max - min + 1) ** BigInt(rolls);
      return = Number(favorable) / Number(total);
    }

    function calculate() {
      const min = Number(document.getElementById("min").value);
      const max = Number(document.getElementById("max").value);
      const rolls = Number(document.getElementById("rolls").value);
      const target = Number(document.getElementById("target").value);
  
      const result = document.getElementById("result");
  
      const calculation = calculateProbability(min, max, rolls, target);
  
      document.getElementById("percentage").textContent = (calculation * 100).toFixed(2) + "%";
      
    }
  </script>
</head>

<body>
  <div class="container">
    <h2>Test Calculator</h2>

    <label for="min">min value</label>
    <input type="number" id="min" value="1" step="1">
    <br>

    <label for="max">max value</label>
    <input type="number" id="max" value="1" step="1">
    <br>
  
    <label for="rolls">number of rolls</label>
    <input type="number" id="rolls" value="1" min="1" step="1">

    <label for="target">target total</label>
    <input type="number" id="target" value="1" step="1">

    <button onclick="calculate()">Calculate</button>
  
    <div>Probability</div>
    <div class="percentage" id="percentage"></div>
  </div>
</body>
</html>
